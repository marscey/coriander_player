appId: com.senyepss.corianderPlayer
---
# 测试设置页面测试配置开关
- launchApp
- waitForAnimationToEnd:
    timeout: 5000

# 点击设置
- tapOn: "设置"
- waitForAnimationToEnd:
    timeout: 2000

# 截图设置页面
- takeScreenshot: test/reports/screenshots/settings-01-page

# 滚动到底部查看测试配置
- scrollUntilVisible:
    element:
      text: "自动配置测试云服务和导入音频"
    direction: DOWN
    timeout: 5000

# 截图测试配置区域
- takeScreenshot: test/reports/screenshots/settings-02-test-config

# 验证测试配置开关存在
- assertVisible: "自动配置测试云服务和导入音频"
