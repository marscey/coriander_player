appId: com.senyepss.corianderPlayer
---
# 测试导航按钮一致性 - 音乐详情页
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "音乐库"

# 长按第一首歌
- longPressOn:
    id: "audio_tile_0"
- waitForAnimationToEnd:
    timeout: 1000

# 点击详细信息
- tapOn: "详细信息"
- waitForAnimationToEnd:
    timeout: 2000

# 截图音乐详情页
- takeScreenshot: test/reports/screenshots/nav-consistency-01-audio-detail

# 验证页面元素
- assertVisible: "音乐详情"
- assertVisible: "艺术家"
- assertVisible: "专辑"
