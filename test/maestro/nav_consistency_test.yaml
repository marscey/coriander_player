appId: com.senyepss.corianderPlayer
---
# 测试导航按钮一致性
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "音乐库"

# 长按第一首歌
- longPressOn:
    id: "audio_tile_0"
- waitForAnimationToEnd:
    timeout: 1000

# 点击详细信息（音乐详情页）
- tapOn: "详细信息"
- waitForAnimationToEnd:
    timeout: 2000

# 截图音乐详情页
- takeScreenshot: test/reports/screenshots/nav-consistency-01-audio-detail

# 使用 go back 返回
- pressKey: Back
- waitForAnimationToEnd:
    timeout: 1000

# 长按第一首歌
- longPressOn:
    id: "audio_tile_0"
- waitForAnimationToEnd:
    timeout: 1000

# 点击编辑标签
- tapOn: "编辑标签"
- waitForAnimationToEnd:
    timeout: 2000

# 截图编辑标签页
- takeScreenshot: test/reports/screenshots/nav-consistency-02-edit-tag

# 使用 go back 返回
- pressKey: Back
- waitForAnimationToEnd:
    timeout: 1000
